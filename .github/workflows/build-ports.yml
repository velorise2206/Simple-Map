name: Build Simple Map (10 Ports — Phase 2 — Common MultiLoader)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fabric-1-20-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.20.1/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: simple-map-1.20.1-fabric
          path: 1.20.1/fabric/build/libs/*.jar

  forge-1-20-1:
